services:
  postgres:
    image: postgres:16-alpine
    container_name: sdl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-systemdesignlab}
      POSTGRES_USER: ${POSTGRES_USER:-sdl_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdl_secret_2026!}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sdl_admin} -d ${POSTGRES_DB:-systemdesignlab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdl-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sdl-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-systemdesignlab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-sdl_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sdl_secret_2026!}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-super-secret-jwt-signing-key-for-system-design-lab-production-must-be-256-bits-long!}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sdl-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdl-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sdl-network

volumes:
  postgres_data:
    driver: local

networks:
  sdl-network:
    driver: bridge
